[project]
name = "load-tester"
version = "0.1.0"
description = "Load tester util for kafka"
authors = [
    { name = "darmoise", email = "darmoise@localhost.local" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kafka-python (>=2.2.2,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
